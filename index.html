<!DOCTYPE html>
<!-- Mi Huerto: el huerto y la gestión de la Finca Mulalillo en una sola app.
     El tema `apps` de mal-ds teñido con el verde de agro; la piel del huerto
     va encima, en styles.css. -->
<html lang="es" data-marca="apps" data-app="agro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121412" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Qué hacer hoy en la finca, cuánta agua queda, qué sembrar y a cuánto se vende. Funciona sin señal." />
  <title>Mi Huerto · Finca Mulalillo</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Mi Huerto" />

  <link rel="stylesheet" href="./ds/mal/mal.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="preload" href="./ds/fonts/inter.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Los módulos de la app se piden todos a la vez y no en cascada (cada
       import descubierto tarde cuesta un viaje de ida y vuelta, y en el campo
       eso es medio segundo). El mapa y el 3D no: bajan al abrir Finca. -->
  <link rel="modulepreload" href="./app.js" />
  <link rel="modulepreload" href="./estado.js" />
  <link rel="modulepreload" href="./ui.js" />
  <link rel="modulepreload" href="./fechas.js" />
  <link rel="modulepreload" href="./db.js" />
  <link rel="modulepreload" href="./geo.js" />
  <link rel="modulepreload" href="./water.js" />
  <link rel="modulepreload" href="./clima.js" />
  <link rel="modulepreload" href="./sensores.js" />
  <link rel="modulepreload" href="./normaliza.js" />
  <link rel="modulepreload" href="./map2d.js" />
  <link rel="modulepreload" href="./planting.js" />
  <link rel="modulepreload" href="./hydraulics.js" />
  <link rel="modulepreload" href="./huerto/huerto.js" />
  <link rel="modulepreload" href="./huerto/catalogo.js" />
  <link rel="modulepreload" href="./huerto/nino.js" />
  <link rel="modulepreload" href="./huerto/luna.js" />
  <link rel="modulepreload" href="./vistas/hoy.js" />

  <script>
    // MapLibre (800 kB) ya no se carga aquí: bloqueaba la primera pantalla
    // aunque Hoy no lo usa. Lo pide app.js al abrir Finca. Esto sólo distingue
    // "no se pudo descargar" de "el navegador no pudo ejecutarlo".
    window.__mapLib = {};
    addEventListener('error', e => {
      if (e.filename && e.filename.indexOf('maplibre-gl') !== -1) {
        window.__mapLib.exec = e.message || 'error al ejecutar la librería';
      }
    }, true);
  </script>
</head>
<body>

<span class="badge badge-warn estado-red" id="chip-offline" hidden>Sin conexión</span>

<!-- Hoy: la entrada. Qué hacer, si hay agua, y anotar lo del día. -->
<main class="view active" id="view-hoy">
  <div class="contenido" id="hoy-body"></div>
</main>

<!-- Finca: el mapa y el inventario -->
<main class="view" id="view-finca">
  <div class="cabecera cabecera--compacta">
    <h2>Finca</h2>
    <div class="seg seg--ancho" id="finca-seg" role="tablist" aria-label="Ver la finca">
      <button role="tab" aria-selected="true" data-pane="mapa">Mapa</button>
      <button role="tab" aria-selected="false" data-pane="sectores">Sectores</button>
      <button role="tab" aria-selected="false" data-pane="plantas">Plantas</button>
    </div>
  </div>

  <section class="pane pane--mapa" id="finca-mapa">
    <div id="map"></div>
    <div class="mapa-herramientas" role="toolbar" aria-label="Herramientas del mapa">
      <button class="chip-mapa" id="btn-fit"><svg class="icono icono--s" aria-hidden="true"><use href="#i-cuadricula"/></svg>Toda la finca</button>
      <button class="chip-mapa" id="btn-gps"><svg class="icono icono--s" aria-hidden="true"><use href="#i-pin"/></svg>Dónde estoy</button>
      <button class="chip-mapa" id="btn-layers"><svg class="icono icono--s" aria-hidden="true"><use href="#i-filtro"/></svg>Colores</button>
      <button class="chip-mapa" id="btn-3d"><svg class="icono icono--s" aria-hidden="true"><use href="#i-grafica"/></svg>Relieve 3D</button>
      <button class="chip-mapa" id="btn-move" aria-pressed="false"><svg class="icono icono--s" aria-hidden="true"><use href="#i-editar"/></svg>Mover puntos</button>
    </div>
    <button class="btn btn--rojo fab" id="fab-add" aria-label="Agregar al mapa">
      <svg class="icono" aria-hidden="true"><use href="#i-mas"/></svg><span>Agregar</span>
    </button>
    <div class="banner" id="map-banner" hidden></div>

    <section class="panel card" id="panel-layers" hidden>
      <h3>Ver en el mapa</h3>
      <div class="field">
        <label for="sel-colorby">Pintar las plantas por</label>
        <select id="sel-colorby">
          <option value="species">Especie</option>
          <option value="status">Cómo están (sanas, con problema)</option>
        </select>
      </div>
      <div class="field">
        <label for="sel-filter-species">Especie</label>
        <select id="sel-filter-species"><option value="all">Todas</option></select>
      </div>
      <div class="field">
        <label for="sel-filter-status">Estado</label>
        <select id="sel-filter-status">
          <option value="all">Todos</option>
          <option value="sano">Sanas</option>
          <option value="atención">Con algo raro</option>
          <option value="enfermo">Enfermas</option>
          <option value="muerto">Muertas</option>
        </select>
      </div>
      <div class="field">
        <label for="sel-filter-sector">Sector</label>
        <select id="sel-filter-sector"><option value="all">Todos</option></select>
      </div>
      <button class="btn btn-block" data-close-panel>Listo</button>
    </section>
  </section>

  <section class="pane" id="finca-sectores" hidden>
    <div class="contenido">
      <div class="seccion-cab seccion-cab--accion">
        <p class="sub">Toca un sector para ver sus plantas, su riego y sus tareas.</p>
        <button class="btn btn--sm btn--rojo" id="btn-new-sector">
          <svg class="icono icono--s" aria-hidden="true"><use href="#i-mas"/></svg>Sector</button>
      </div>
      <div id="sectors-list" class="list"></div>
    </div>
  </section>

  <section class="pane" id="finca-plantas" hidden>
    <div class="contenido">
      <div class="seccion-cab seccion-cab--accion">
        <input type="search" class="buscar" id="plant-search" placeholder="Buscar planta…" aria-label="Buscar plantas" />
        <button class="btn btn--sm btn--rojo" id="btn-new-plant">
          <svg class="icono icono--s" aria-hidden="true"><use href="#i-mas"/></svg>Planta</button>
      </div>
      <div id="plants-list" class="list"></div>
    </div>
  </section>
</main>

<!-- Relieve 3D: se entra desde el mapa -->
<main class="view" id="view-3d">
  <div id="three"></div>
  <button class="chip-mapa chip-mapa--volver" id="btn-3d-volver">
    <svg class="icono icono--s" aria-hidden="true"><use href="#i-flecha-izq"/></svg>Volver al mapa</button>
  <div class="three-controls card abierto" id="three-controls">
    <button class="three-head" id="three-toggle" aria-expanded="true">
      Relieve y por dónde corre el agua
      <svg class="icono caret" aria-hidden="true"><use href="#i-chevron-abajo"/></svg>
    </button>
    <div class="three-body">
      <div class="field">
        <label for="range-exag">Exagerar la altura <output id="out-exag">3×</output></label>
        <input type="range" id="range-exag" min="1" max="12" step="0.5" value="3" />
      </div>
      <label class="row"><input type="checkbox" id="chk-arrows" checked /> Flechas: hacia dónde corre el agua</label>
      <button class="btn btn-block" id="btn-recenter">Volver a centrar</button>
      <p class="hint" id="three-hint"></p>
    </div>
  </div>
</main>

<!-- Tareas -->
<main class="view" id="view-tasks">
  <div class="contenido">
    <div class="cabecera">
      <h1>Tareas</h1>
      <div class="cabecera__acciones">
        <button class="btn btn--sm btn--rojo" id="btn-new-task">
          <svg class="icono icono--s" aria-hidden="true"><use href="#i-mas"/></svg>Nueva</button>
      </div>
    </div>
    <div class="seg seg--ancho" id="task-seg" role="tablist" aria-label="Qué tareas ver">
      <button role="tab" aria-selected="true" data-filter="pendientes">Por hacer</button>
      <button role="tab" aria-selected="false" data-filter="hechas">Hechas</button>
      <button role="tab" aria-selected="false" data-filter="todas">Todas</button>
    </div>
    <div id="tasks-list" class="list"></div>
  </div>
</main>

<!-- Agua -->
<main class="view" id="view-water">
  <div class="contenido">
    <div class="cabecera">
      <h1>Agua</h1>
      <div class="cabecera__acciones">
        <button class="btn btn--sm btn--rojo" id="btn-new-water">
          <svg class="icono icono--s" aria-hidden="true"><use href="#i-mas"/></svg>Anotar</button>
      </div>
    </div>
    <div id="water-body"></div>
  </div>
</main>

<!-- Huerto: lo que era Mi Huerto -->
<main class="view" id="view-huerto">
  <div class="contenido">
    <div class="cabecera">
      <h1>Huerto</h1>
    </div>
    <div class="seg seg--ancho" id="huerto-seg" role="tablist" aria-label="Huerto">
      <button role="tab" aria-selected="true" data-pane="sembrar">Qué sembrar</button>
      <button role="tab" aria-selected="false" data-pane="siembras">Mis siembras</button>
      <button role="tab" aria-selected="false" data-pane="mercado">Mercado</button>
    </div>
    <section class="pane" id="huerto-sembrar"></section>
    <section class="pane" id="huerto-siembras" hidden></section>
    <section class="pane" id="huerto-mercado" hidden></section>
  </div>
</main>

<nav class="navbar" aria-label="Secciones">
  <button class="nav-item" data-view="view-hoy" aria-current="page">
    <svg class="icono" aria-hidden="true"><use href="#i-casa"/></svg><span>Hoy</span>
  </button>
  <button class="nav-item" data-view="view-finca">
    <svg class="icono" aria-hidden="true"><use href="#i-pin"/></svg><span>Finca</span>
  </button>
  <button class="nav-item" data-view="view-tasks">
    <svg class="icono" aria-hidden="true"><use href="#i-check"/></svg><span>Tareas</span>
  </button>
  <button class="nav-item" data-view="view-water">
    <svg class="icono" aria-hidden="true"><use href="#i-gota"/></svg><span>Agua</span>
  </button>
  <button class="nav-item" data-view="view-huerto">
    <svg class="icono" aria-hidden="true"><use href="#i-semilla"/></svg><span>Huerto</span>
  </button>
</nav>

<!-- Hoja inferior del sistema sobre <dialog>: el navegador se encarga del
     foco y de cerrar con Escape. -->
<dialog class="modal modal--hoja" id="sheet">
  <div class="modal__cab">
    <h3 id="sheet-title"></h3>
    <button class="btn btn--icono" id="sheet-close" aria-label="Cerrar">
      <svg class="icono" aria-hidden="true"><use href="#i-cerrar"/></svg>
    </button>
  </div>
  <div class="modal__cuerpo" id="sheet-body"></div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="./app.js"></script>
</body>
</html>
