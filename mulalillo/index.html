<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1f7a3d" />
  <meta name="description" content="Gestión de la Finca Mulalillo: mapa satelital, sectores, plantas, tareas, agua y relieve 3D." />
  <title>Finca Mulalillo — gestión</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="../icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Mulalillo" />

  <link rel="stylesheet" href="./lib/maplibre-gl.css" />
  <link rel="stylesheet" href="../styles/design-system.css" />
  <link rel="stylesheet" href="./styles.css" />

  <!-- Librerías servidas por la propia app: sin CDN, funciona sin señal desde la primera visita. -->
  <script>
    // Distingue "no se pudo descargar" de "el navegador no pudo ejecutarlo",
    // para que el aviso en pantalla diga algo accionable.
    window.__mapLib = {};
    addEventListener('error', e => {
      if (e.filename && e.filename.indexOf('maplibre-gl') !== -1) {
        window.__mapLib.exec = e.message || 'error al ejecutar la librería';
      }
    }, true);
  </script>
  <script src="./lib/maplibre-gl.js"
          onerror="window.__mapLib.network = true"></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-title">
    <strong>Finca Mulalillo</strong>
    <span id="topbar-sub">Salcedo, Cotopaxi</span>
  </div>
  <div class="topbar-actions">
    <span class="chip" id="chip-offline" hidden>Sin conexión</span>
    <span class="chip" id="chip-outbox" hidden></span>
    <button class="icon-btn" id="btn-settings" title="Ajustes">⚙︎</button>
  </div>
</header>

<!-- Vista Mapa -->
<main class="view active" id="view-map">
  <div id="map"></div>

  <div class="map-toolbar">
    <button class="tool" id="btn-fit" title="Ver toda la finca">⤢</button>
    <button class="tool" id="btn-gps" title="Mi ubicación GPS">◎</button>
    <button class="tool" id="btn-move" title="Mover puntos arrastrando">✥</button>
    <button class="tool" id="btn-layers" title="Colorear y filtrar">◍</button>
  </div>

  <div class="map-fabs">
    <button class="fab" id="fab-add" title="Agregar">+</button>
  </div>

  <div class="banner" id="map-banner" hidden></div>

  <section class="panel" id="panel-layers" hidden>
    <h3>Ver</h3>
    <label>Colorear plantas por
      <select id="sel-colorby">
        <option value="species">Especie</option>
        <option value="status">Estado sanitario</option>
      </select>
    </label>
    <label>Especie
      <select id="sel-filter-species"><option value="all">Todas</option></select>
    </label>
    <label>Estado
      <select id="sel-filter-status">
        <option value="all">Todos</option>
        <option value="sano">Sano</option>
        <option value="atención">Atención</option>
        <option value="enfermo">Enfermo</option>
        <option value="muerto">Muerto</option>
      </select>
    </label>
    <label>Sector
      <select id="sel-filter-sector"><option value="all">Todos</option></select>
    </label>
    <button class="btn-ghost" data-close-panel>Cerrar</button>
  </section>
</main>

<!-- Vista Sectores -->
<main class="view" id="view-sectors">
  <div class="list-head">
    <h2>Sectores</h2>
    <button class="btn-small" id="btn-new-sector">Dibujar sector</button>
  </div>
  <div id="sectors-list" class="list"></div>
</main>

<!-- Vista Plantas -->
<main class="view" id="view-plants">
  <div class="list-head">
    <h2>Plantas</h2>
    <button class="btn-small" id="btn-new-plant">Nueva planta</button>
  </div>
  <div class="filters-row">
    <input type="search" id="plant-search" placeholder="Buscar especie, variedad, nota…" />
  </div>
  <div id="plants-list" class="list"></div>
</main>

<!-- Vista Tareas -->
<main class="view" id="view-tasks">
  <div class="list-head">
    <h2>Tareas</h2>
    <div class="head-actions">
      <button class="btn-small ghost" id="btn-share-plan">Compartir plan</button>
      <button class="btn-small" id="btn-new-task">Nueva tarea</button>
    </div>
  </div>
  <div class="seg" id="task-seg">
    <button class="seg-btn active" data-filter="pendientes">Pendientes</button>
    <button class="seg-btn" data-filter="hechas">Hechas</button>
    <button class="seg-btn" data-filter="todas">Todas</button>
  </div>
  <div id="tasks-list" class="list"></div>
</main>

<!-- Vista Agua -->
<main class="view" id="view-water">
  <div class="list-head">
    <h2>Agua</h2>
    <button class="btn-small" id="btn-new-water">Registrar evento</button>
  </div>
  <div id="water-body"></div>
</main>

<!-- Vista 3D -->
<main class="view" id="view-3d">
  <div id="three"></div>
  <div class="three-controls abierto" id="three-controls">
    <button class="three-head" id="three-toggle" aria-expanded="true">
      Relieve y escurrimiento <span class="caret">▾</span>
    </button>
    <div class="three-body">
      <label>Exageración vertical <output id="out-exag">3×</output>
        <input type="range" id="range-exag" min="1" max="12" step="0.5" value="3" />
      </label>
      <label class="row"><input type="checkbox" id="chk-arrows" checked /> Flechas de escurrimiento</label>
      <div class="three-actions">
        <button class="btn-ghost" id="btn-recenter">Recentrar vista</button>
      </div>
      <p class="hint" id="three-hint"></p>
    </div>
  </div>
</main>

<nav class="tabbar">
  <button class="tab active" data-view="view-map">
    <svg viewBox="0 0 24 24"><path d="m9 4-6 2.5v13L9 17l6 3 6-2.5v-13L15 7 9 4z"/><path d="M9 4v13M15 7v13"/></svg>
    <span>Mapa</span>
  </button>
  <button class="tab" data-view="view-sectors">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
    <span>Sectores</span>
  </button>
  <button class="tab" data-view="view-plants">
    <svg viewBox="0 0 24 24"><path d="M12 21v-8"/><path d="M12 13c0-4 3-7 8-7 0 5-3 8-8 8z"/><path d="M12 15c0-3-2.5-5.5-6-5.5 0 3.8 2.4 6 6 6z"/></svg>
    <span>Plantas</span>
  </button>
  <button class="tab" data-view="view-tasks">
    <svg viewBox="0 0 24 24"><path d="M9 11l2.5 2.5L16 8"/><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M8 2v4M16 2v4"/></svg>
    <span>Tareas</span>
  </button>
  <button class="tab" data-view="view-water">
    <svg viewBox="0 0 24 24"><path d="M12 3s6 6.4 6 10.5A6 6 0 0 1 6 13.5C6 9.4 12 3 12 3z"/></svg>
    <span>Agua</span>
  </button>
  <button class="tab" data-view="view-3d">
    <svg viewBox="0 0 24 24"><path d="m3 19 6-9 4 5.5 2.5-3L21 19H3z"/><circle cx="8" cy="6.5" r="2"/></svg>
    <span>Relieve</span>
  </button>
</nav>

<!-- Hoja modal reutilizable -->
<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
  <header class="sheet-head">
    <h3 id="sheet-title"></h3>
    <button class="icon-btn" id="sheet-close" aria-label="Cerrar">✕</button>
  </header>
  <div class="sheet-body" id="sheet-body"></div>
</section>

<div class="toast" id="toast" hidden></div>

<script type="module" src="./app.js"></script>
</body>
</html>
