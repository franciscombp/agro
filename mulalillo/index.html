<!DOCTYPE html>
<!-- El tema `apps` del sistema, teñido con el color de agro. Ambos atributos
     van en la raíz: el tinte se declara junto al tema a propósito. -->
<html lang="es" data-marca="apps" data-app="agro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1f7a3d" />
  <meta name="description" content="Gestión de la Finca Mulalillo: mapa satelital, sectores, plantas, tareas, agua y relieve 3D." />
  <title>Finca Mulalillo — gestión</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="../icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Mulalillo" />

  <link rel="stylesheet" href="./lib/maplibre-gl.css" />
  <!-- mal-ds primero; styles.css sólo añade lo propio de esta app. -->
  <link rel="stylesheet" href="../ds/mal/mal.css" />
  <link rel="stylesheet" href="./styles.css" />

  <!-- Librerías servidas por la propia app: sin CDN, funciona sin señal desde la primera visita. -->
  <script>
    // Distingue "no se pudo descargar" de "el navegador no pudo ejecutarlo",
    // para que el aviso en pantalla diga algo accionable.
    window.__mapLib = {};
    addEventListener('error', e => {
      if (e.filename && e.filename.indexOf('maplibre-gl') !== -1) {
        window.__mapLib.exec = e.message || 'error al ejecutar la librería';
      }
    }, true);
  </script>
  <script src="./lib/maplibre-gl.js"
          onerror="window.__mapLib.network = true"></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-title">
    <strong>Finca Mulalillo</strong>
    <span id="topbar-sub">Salcedo, Cotopaxi</span>
  </div>
  <div class="topbar-actions">
    <span class="badge badge-warn" id="chip-offline" hidden>Sin conexión</span>
    <span class="badge" id="chip-outbox" hidden></span>
    <button class="btn btn--icono" id="btn-settings" aria-label="Ajustes">
      <svg class="icono" aria-hidden="true"><use href="#i-ajustes"/></svg>
    </button>
  </div>
</header>

<!-- Vista Mapa -->
<main class="view active" id="view-map">
  <div id="map"></div>

  <div class="map-toolbar">
    <button class="btn btn--icono" id="btn-fit" aria-label="Ver toda la finca">
      <svg class="icono" aria-hidden="true"><use href="#i-cuadricula"/></svg>
    </button>
    <button class="btn btn--icono" id="btn-gps" aria-label="Mi ubicación GPS">
      <svg class="icono" aria-hidden="true"><use href="#i-pin"/></svg>
    </button>
    <button class="btn btn--icono" id="btn-move" aria-label="Mover puntos arrastrando" aria-pressed="false">
      <svg class="icono" aria-hidden="true"><use href="#i-editar"/></svg>
    </button>
    <button class="btn btn--icono" id="btn-layers" aria-label="Colorear y filtrar">
      <svg class="icono" aria-hidden="true"><use href="#i-filtro"/></svg>
    </button>
  </div>

  <div class="map-fabs">
    <button class="btn btn--rojo btn--icono fab" id="fab-add" aria-label="Agregar">
      <svg class="icono" aria-hidden="true"><use href="#i-mas"/></svg>
    </button>
  </div>

  <div class="banner" id="map-banner" hidden></div>

  <section class="panel card" id="panel-layers" hidden>
    <h3 class="sheet-title">Ver</h3>
    <div class="field">
      <label for="sel-colorby">Colorear plantas por</label>
      <select id="sel-colorby">
        <option value="species">Especie</option>
        <option value="status">Estado sanitario</option>
      </select>
    </div>
    <div class="field">
      <label for="sel-filter-species">Especie</label>
      <select id="sel-filter-species"><option value="all">Todas</option></select>
    </div>
    <div class="field">
      <label for="sel-filter-status">Estado</label>
      <select id="sel-filter-status">
        <option value="all">Todos</option>
        <option value="sano">Sano</option>
        <option value="atención">Atención</option>
        <option value="enfermo">Enfermo</option>
        <option value="muerto">Muerto</option>
      </select>
    </div>
    <div class="field">
      <label for="sel-filter-sector">Sector</label>
      <select id="sel-filter-sector"><option value="all">Todos</option></select>
    </div>
    <button class="btn btn-block" data-close-panel>Cerrar</button>
  </section>
</main>

<!-- Vista Sectores -->
<main class="view" id="view-sectors">
  <div class="list-head">
    <h2>Sectores</h2>
    <button class="btn btn--sm btn--rojo" id="btn-new-sector">Dibujar sector</button>
  </div>
  <div id="sectors-list" class="list"></div>
</main>

<!-- Vista Plantas -->
<main class="view" id="view-plants">
  <div class="list-head">
    <h2>Plantas</h2>
    <button class="btn btn--sm btn--rojo" id="btn-new-plant">Nueva planta</button>
  </div>
  <div class="field filters-row">
    <input type="search" id="plant-search" placeholder="Buscar especie, variedad, nota…" aria-label="Buscar plantas" />
  </div>
  <div id="plants-list" class="list"></div>
</main>

<!-- Vista Tareas -->
<main class="view" id="view-tasks">
  <div class="list-head">
    <h2>Tareas</h2>
    <div class="head-actions">
      <button class="btn btn--sm" id="btn-share-plan">Compartir plan</button>
      <button class="btn btn--sm btn--rojo" id="btn-new-task">Nueva tarea</button>
    </div>
  </div>
  <div class="seg" id="task-seg" role="tablist">
    <button role="tab" aria-selected="true" data-filter="pendientes">Pendientes</button>
    <button role="tab" aria-selected="false" data-filter="hechas">Hechas</button>
    <button role="tab" aria-selected="false" data-filter="todas">Todas</button>
  </div>
  <div id="tasks-list" class="list"></div>
</main>

<!-- Vista Agua -->
<main class="view" id="view-water">
  <div class="list-head">
    <h2>Agua</h2>
    <button class="btn btn--sm btn--rojo" id="btn-new-water">Registrar evento</button>
  </div>
  <div id="water-body"></div>
</main>

<!-- Vista relieve -->
<main class="view" id="view-3d">
  <div id="three"></div>
  <div class="three-controls card abierto" id="three-controls">
    <button class="three-head" id="three-toggle" aria-expanded="true">
      Relieve y escurrimiento
      <svg class="icono caret" aria-hidden="true"><use href="#i-chevron-abajo"/></svg>
    </button>
    <div class="three-body">
      <div class="field">
        <label for="range-exag">Exageración vertical <output id="out-exag">3×</output></label>
        <input type="range" id="range-exag" min="1" max="12" step="0.5" value="3" />
      </div>
      <label class="row"><input type="checkbox" id="chk-arrows" checked /> Flechas de escurrimiento</label>
      <button class="btn btn-block" id="btn-recenter">Recentrar vista</button>
      <p class="hint" id="three-hint"></p>
    </div>
  </div>
</main>

<nav class="navbar">
  <button class="nav-item" data-view="view-map" aria-current="page">
    <svg class="icono" aria-hidden="true"><use href="#i-pin"/></svg><span>Mapa</span>
  </button>
  <button class="nav-item" data-view="view-sectors">
    <svg class="icono" aria-hidden="true"><use href="#i-cuadricula"/></svg><span>Sectores</span>
  </button>
  <button class="nav-item" data-view="view-plants">
    <svg class="icono" aria-hidden="true"><use href="#i-hoja"/></svg><span>Plantas</span>
  </button>
  <button class="nav-item" data-view="view-tasks">
    <svg class="icono" aria-hidden="true"><use href="#i-check"/></svg><span>Tareas</span>
  </button>
  <button class="nav-item" data-view="view-water">
    <svg class="icono" aria-hidden="true"><use href="#i-gota"/></svg><span>Agua</span>
  </button>
  <button class="nav-item" data-view="view-3d">
    <svg class="icono" aria-hidden="true"><use href="#i-grafica"/></svg><span>Relieve</span>
  </button>
</nav>

<!-- Hoja inferior del sistema sobre <dialog>: el navegador se encarga del
     foco y de cerrar con Escape, que a mano estaba sin resolver. -->
<dialog class="modal modal--hoja" id="sheet">
  <div class="modal__cab">
    <h3 id="sheet-title"></h3>
    <button class="btn btn--icono" id="sheet-close" aria-label="Cerrar">
      <svg class="icono" aria-hidden="true"><use href="#i-cerrar"/></svg>
    </button>
  </div>
  <div class="modal__cuerpo" id="sheet-body"></div>
</dialog>

<div class="toast" id="toast" hidden></div>

<script type="module" src="./app.js"></script>
</body>
</html>
